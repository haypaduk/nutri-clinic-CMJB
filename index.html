<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri "CMJB" - Sistema Clínico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Video de fondo local -->
    <div class="video-background">
        <video autoplay muted loop playsinline id="bgVideo">
            <source src="./videos/red-ui-moewalls-com.mp4" type="video/mp4">
            <!-- Si no hay video, mostrar imagen de respaldo -->
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <h1>Nutri <span>Sin Azúcar</span><br>Pero con Gracia "CMJB"</h1>
            <h2><i class="fas fa-lock"></i> Acceso al Sistema</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user-md"></i> Nombre del Nutriólogo:</label>
                    <input type="text" id="nombre" required placeholder="Ej: Dr. Juan Pérez">
                </div>
                <button type="submit">
                    <i class="fas fa-sign-in-alt"></i> Ingresar al Sistema
                </button>
            </form>
            <div class="login-footer">
                <p><i class="fas fa-shield-alt"></i> Sistema Seguro | Solo Personal Autorizado</p>
            </div>
        </div>
    </div>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
