<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri "CMJB" - Sistema Clínico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header>
            <h1><i class="fas fa-clinic-medical"></i> Nutri Sin Azúcar, Pero con Gracia "CMJB"</h1>
            <div class="user-info">
                <i class="fas fa-user-md"></i>
                <span id="nutriologoName"></span>
                <button id="logoutBtn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Fila 1: REGISTRAR NUEVO PACIENTE -->
            <div class="panel register-panel">
                <h2><i class="fas fa-user-plus"></i> Registrar Nuevo Paciente</h2>
                <form id="patientForm">
                    <input type="hidden" id="patientId">
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Nombre Completo:</label>
                            <input type="text" id="patientName" required placeholder="Ej: Juan Pérez">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-calendar-alt"></i> Edad (años):</label>
                            <input type="number" id="patientAge" required min="0" max="120" placeholder="35">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-weight-scale"></i> Peso (kg):</label>
                            <input type="number" id="patientWeight" step="0.1" required placeholder="70.5">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-ruler"></i> Altura (m):</label>
                            <input type="number" id="patientHeight" step="0.01" required placeholder="1.75">
                        </div>
                    </div>
                    <div id="imcPreview" class="imc-preview"></div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Guardar Paciente
                    </button>
                </form>
            </div>

            <!-- Fila 2: Selección de Paciente -->
            <div class="panel patient-selector">
                <h2><i class="fas fa-users"></i> Seleccionar Paciente</h2>
                <div class="selector-container">
                    <select id="patientSelect" class="patient-combobox">
                        <option value="">-- Seleccione un paciente --</option>
                    </select>
                    <button id="deletePatientBtn" class="btn-delete" style="display: none;">
                        <i class="fas fa-trash-alt"></i> Eliminar Paciente
                    </button>
                </div>
            </div>

            <!-- Fila 3: Datos del Paciente + Nueva Consulta -->
            <div class="two-columns">
                <!-- Columna Izquierda: Datos Fijos del Paciente -->
                <div class="panel patient-data">
                    <h2><i class="fas fa-address-card"></i> Datos del Paciente</h2>
                    <div id="patientInfo" class="patient-info">
                        <p class="placeholder"><i class="fas fa-info-circle"></i> Seleccione un paciente para ver sus datos</p>
                    </div>
                </div>

                <!-- Columna Derecha: Nueva Consulta -->
                <div class="panel new-consultation">
                    <h2><i class="fas fa-notes-medical"></i> Nueva Consulta</h2>
                    <form id="consultationForm">
                        <input type="hidden" id="consultationId">
                        <input type="hidden" id="currentPatientId">
                        <div class="form-group">
                            <label><i class="far fa-calendar-alt"></i> Fecha y Hora:</label>
                            <input type="datetime-local" id="consultationDateTime" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-chart-line"></i> Evolución del Paciente:</label>
                            <textarea id="evolution" rows="3" required placeholder="Describa la evolución del paciente..."></textarea>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-utensils"></i> Plan de Alimentación:</label>
                            <textarea id="mealPlan" rows="3" required placeholder="Detalle el plan de alimentación..."></textarea>
                        </div>
                        <button type="submit" id="saveConsultationBtn" class="btn-primary">
                            <i class="fas fa-save"></i> Agregar Consulta
                        </button>
                    </form>
                </div>
            </div>

            <!-- Fila 4: Historial Cronológico -->
            <div class="panel full-width history-panel">
                <h2><i class="fas fa-history"></i> Historial de Consultas</h2>
                <div class="history-header">
                    <button id="deleteAllConsultationsBtn" class="btn-delete-all" style="display: none;">
                        <i class="fas fa-trash-alt"></i> Eliminar Todo el Historial
                    </button>
                </div>
                <div id="consultationsHistory" class="consultations-list">
                    <p class="placeholder"><i class="fas fa-folder-open"></i> Seleccione un paciente para ver su historial</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
